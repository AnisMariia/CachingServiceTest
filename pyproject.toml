[project]
name = "caching-service"
version = "0.1.0"
description = "FastAPI microservice that generates payloads and caches the results of a slow transformer."
readme = "README.md"
authors = [
    { name = "mariia_anisimova", email = "anisimovatriz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "alembic>=1.20.0",
]

[project.scripts]
cache-cli = "caching_service.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "caching_service"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "alembic.*"]
ignore_missing_imports = true
