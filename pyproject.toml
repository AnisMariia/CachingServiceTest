[project]
name = "caching-service"
version = "0.1.0"
description = "FastAPI microservice that generates payloads and caches the results of a slow transformer."
readme = "README.md"
authors = [
    { name = "mariia_anisimova", email = "anisimovatriz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "alembic>=1.20.0",
]

[project.scripts]
cache-cli = "caching_service.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "caching_service"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
